# v로 시작하는 태그(예: v0.2.0)를 푸시하면 Windows용 설치 파일을 만들어 GitHub Release에 올린다.
# 설치된 게임은 실행할 때 이 Release를 확인해서 자동으로 업데이트한다 (electron/main.cjs).
#
# 새 버전 내기 (둘 중 하나):
#   1) npm version patch && git push --follow-tags   (package.json 버전 + 태그를 함께 올림)
#   2) package.json 버전을 올려 main에 머지한 뒤, Actions → "Release (Windows)" → Run workflow
#      (Release를 만들면서 v<버전> 태그가 자동으로 생긴다)
name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 버전 확인
        id: ver
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "태그($GITHUB_REF_NAME)와 package.json 버전($tag)이 다르다. npm version으로 올릴 것." >&2
            exit 1
          fi
      - name: 같은 버전의 깨진 Release 정리 (초안 포함, 설치 파일이 든 공개 Release는 건드리지 않음)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft, ([.assets[].name] | join(\",\"))] | @tsv")
          if echo "$releases" | awk -F'\t' '$2 == "false" && $3 ~ /(^|,)[^,]*\.exe(,|$)/' | grep -q .; then
            echo "$TAG Release가 이미 설치 파일과 함께 공개되어 있다. 버전을 올려서 다시 실행할 것." >&2
            exit 1
          fi
          echo "$releases" | while IFS=$'\t' read -r id draft assets; do
            [ -z "$id" ] && continue
            echo "지움: Release $id (draft=$draft, 파일: ${assets:-없음})"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
      - name: 태그 만들기 (수동 실행일 때)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git push origin ":refs/tags/$TAG"
          fi
          git tag "$TAG"
          git push origin "$TAG"
      - name: 초안 Release 미리 만들기
        # electron-builder가 파일을 동시에 올리면서 Release를 두 개 만드는 경쟁을 막는다
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "${TAG#v}" \
            --notes "MELTDOWN ${TAG} — Windows 설치 파일: MELTDOWN-Setup-${TAG#v}.exe"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 설치 파일 빌드 + 초안 Release에 업로드
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release 공개
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
