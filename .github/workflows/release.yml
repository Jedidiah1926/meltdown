# v로 시작하는 태그(예: v0.2.0)를 푸시하면 Windows용 설치 파일을 만들어 GitHub Release에 올린다.
# 설치된 게임은 실행할 때 이 Release를 확인해서 자동으로 업데이트한다 (electron/main.cjs).
#
# 새 버전 내기 (둘 중 하나):
#   1) npm version patch && git push --follow-tags   (package.json 버전 + 태그를 함께 올림)
#   2) package.json 버전을 올려 main에 머지한 뒤, Actions → "Release (Windows)" → Run workflow
#      (Release를 만들면서 v<버전> 태그가 자동으로 생긴다)
name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 태그와 package.json 버전 일치 확인
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "태그($GITHUB_REF_NAME)와 package.json 버전($version)이 다르다. npm version으로 올릴 것." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 설치 파일 빌드 + Release 업로드
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
